# CI for the Kensington VeriMark driver kit.
#
# - Every push: sanity-check the kit contents.
# - Tags (v*): build the library on Arch and on Ubuntu 22.04, assemble a
#   distro-agnostic kit tarball (both prebuilt libs + installer + docs),
#   publish it to the generic package registry, and create a GitLab
#   Release with download links.

stages:
  - check
  - build
  - package
  - release

sanity-check:
  stage: check
  image: alpine:3.20
  script:
    - apk add --no-cache bash
    - bash -n install.sh
    - test -f prebuilt/arch/libfprint-2.so.2.0.0
    - test -f libfprint/libfprint/drivers/realtek/realtek.c
    - test -f libfprint/libfprint/drivers/realtek/realtek.h
    - test -f libfprint/meson.build
    - test -f systemd/override.conf
    - echo "kit contents OK"

build:arch:
  stage: build
  image: archlinux:base-devel
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - pacman -Syu --noconfirm --needed meson ninja gcc pkgconf glib2 libgusb libusb
    - cd libfprint
    - meson setup builddir -Ddrivers=realtek -Dtests=false -Dexamples=false -Ddoc=false -Dintrospection=false
    - meson compile -C builddir
    - mkdir -p "$CI_PROJECT_DIR/artifacts/arch"
    - cp builddir/libfprint/libfprint-2.so.2.0.0 "$CI_PROJECT_DIR/artifacts/arch/"
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week

build:ubuntu-22.04:
  stage: build
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
        python3-pip ninja-build gcc pkg-config libglib2.0-dev libgusb-dev
        libusb-1.0-0-dev
    - pip3 install --quiet meson
    - cd libfprint
    - meson setup builddir -Ddrivers=realtek -Dtests=false -Dexamples=false -Ddoc=false -Dintrospection=false
    - meson compile -C builddir
    - mkdir -p "$CI_PROJECT_DIR/artifacts/ubuntu-22.04"
    - cp builddir/libfprint/libfprint-2.so.2.0.0 "$CI_PROJECT_DIR/artifacts/ubuntu-22.04/"
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week

package:
  stage: package
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  needs: [build:arch, build:ubuntu-22.04]
  script:
    - apk add --no-cache tar curl
    - mkdir -p "kit/prebuilt/arch" "kit/prebuilt/ubuntu-22.04"
    - cp install.sh README.md .gitlab-ci.yml kit/
    - cp -r systemd pam docs kit/
    - cp artifacts/arch/libfprint-2.so.2.0.0 kit/prebuilt/arch/
    - cp artifacts/ubuntu-22.04/libfprint-2.so.2.0.0 kit/prebuilt/ubuntu-22.04/
    - cp -r libfprint kit/libfprint
    - rm -rf kit/libfprint/builddir
    - mv kit "verimark-kit-${CI_COMMIT_TAG}"
    - tar czf "verimark-kit-${CI_COMMIT_TAG}.tar.gz" --owner=0 --group=0 "verimark-kit-${CI_COMMIT_TAG}"
    - mkdir -p dist
    - mv "verimark-kit-${CI_COMMIT_TAG}.tar.gz" dist/
    - (cd dist && sha256sum "verimark-kit-${CI_COMMIT_TAG}.tar.gz" > SHA256SUMS)
    - "curl --silent --show-error --fail
        --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\"
        --upload-file \"dist/verimark-kit-${CI_COMMIT_TAG}.tar.gz\"
        \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/verimark-kit-${CI_COMMIT_TAG}.tar.gz\""
    - "curl --silent --show-error --fail
        --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\"
        --upload-file \"dist/SHA256SUMS\"
        \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/SHA256SUMS\""
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [package]
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "VeriMark kit ${CI_COMMIT_TAG}"
    description: |
      Kensington VeriMark Desktop 2.0 (047d:8228, Realtek RTS58xx) driver
      kit for Linux — patched libfprint realtek driver, prebuilt libraries
      for Arch and Ubuntu 22.04+, installer, PAM wiring and
      reverse-engineering notes.

      **Get started:** download the tarball, extract, then
      `cd verimark-kit && sudo ./install.sh && fprintd-enroll`.
      The installer detects your distro (Arch or Debian/Ubuntu family)
      and picks the matching prebuilt library and PAM file.
      See README.md inside the tarball for details and known pitfalls.
    assets:
      links:
        - name: "verimark-kit-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/verimark-kit-${CI_COMMIT_TAG}.tar.gz"
        - name: "SHA256SUMS"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/SHA256SUMS"
