# Release pipeline: tags (v*) are packaged into a tarball, published to the
# generic package registry, and turned into a GitLab Release with download
# links — so anyone with access can grab a ready-to-use kit.

stages:
  - check
  - package
  - release

sanity-check:
  stage: check
  image: alpine:3.20
  script:
    - apk add --no-cache bash
    - bash -n install.sh
    - test -f prebuilt/libfprint-2.so.2.0.0
    - test -f src/realtek.c
    - test -f src/realtek.h
    - test -f systemd/override.conf
    - echo "kit contents OK"

package:
  stage: package
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apk add --no-cache tar curl
    - mkdir -p dist
    - tar czf "dist/verimark-kit-${CI_COMMIT_TAG}.tar.gz"
        --exclude-vcs --exclude=./dist --owner=0 --group=0
        --transform "s,^\./,verimark-kit/," .
    - (cd dist && sha256sum "verimark-kit-${CI_COMMIT_TAG}.tar.gz" > SHA256SUMS)
    - "curl --silent --show-error --fail
        --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\"
        --upload-file \"dist/verimark-kit-${CI_COMMIT_TAG}.tar.gz\"
        \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/verimark-kit-${CI_COMMIT_TAG}.tar.gz\""
    - "curl --silent --show-error --fail
        --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\"
        --upload-file \"dist/SHA256SUMS\"
        \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/SHA256SUMS\""
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [package]
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "VeriMark kit ${CI_COMMIT_TAG}"
    description: |
      Kensington VeriMark Desktop 2.0 (047d:8228, Realtek RTS58xx) driver
      kit for Linux — patched libfprint realtek driver, prebuilt library,
      installer, PAM wiring and reverse-engineering notes.

      **Get started:** download the tarball, extract, then
      `cd verimark-kit && sudo ./install.sh && fprintd-enroll`.
      See README.md inside the tarball for details and known pitfalls.
    assets:
      links:
        - name: "verimark-kit-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/verimark-kit-${CI_COMMIT_TAG}.tar.gz"
        - name: "SHA256SUMS"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/verimark-kit/${CI_COMMIT_TAG}/SHA256SUMS"
