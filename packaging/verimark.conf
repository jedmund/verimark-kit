# Vendor drop-in for fprintd: make it load the verimark custom libfprint
# build from /usr/lib/verimark (FHS location used by the verimark-kit AUR
# package). This lives in /usr/lib/systemd/system/fprintd.service.d/ so it
# does not touch /etc; shadow it with your own drop-in if needed.
[Service]
Environment=LD_LIBRARY_PATH=/run/libfprint-custom
Environment=FP_DEVICE_CANCELLATION_TIMEOUT=0
BindReadOnlyPaths=/usr/lib/verimark:/run/libfprint-custom
