# Load the Kensington VeriMark (047d:8228, Realtek RTS58xx) driver build
# instead of the stock libfprint, which has no driver for this device.
# install.sh copies the prebuilt library to /opt/verimark/libfprint.
[Service]
Environment=LD_LIBRARY_PATH=/run/libfprint-custom
Environment=FP_DEVICE_CANCELLATION_TIMEOUT=0
BindReadOnlyPaths=/opt/verimark/libfprint:/run/libfprint-custom
